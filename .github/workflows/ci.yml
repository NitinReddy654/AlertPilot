name: ci

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run data pipeline smoke
        run: |
          python scripts/generate_alerts.py
          python scripts/validate_alerts.py
          python scripts/train_triage_model.py
      - name: Build Docker image
        if: github.event_name == 'push'
        run: docker build -t ghcr.io/${GITHUB_REPOSITORY,,}/alertpilot:${{ github.sha }} -f infra/docker/Dockerfile .
