name: AlertPilot
prefect-version: 3.5.0
build: null
push: null
pull:
  - prefect.deployments.steps.set_working_directory:
      directory: .
deployments:
  - name: nightly-triage
    entrypoint: alertpilot_flow.py:triage_pipeline
    parameters: {}
    work_pool:
      name: default-agent-pool
      work_queue_name: null
      job_variables: {}
    schedules:
      - interval: 86400.0
        timezone: UTC
