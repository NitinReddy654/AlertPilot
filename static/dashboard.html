<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AlertPilot Operations Console</title>
  <style>
    body { margin: 0; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f8fb; color: #172033; }
    header { background: #111827; color: white; padding: 20px 28px; }
    main { max-width: 1080px; margin: 0 auto; padding: 28px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
    .card { background: white; border: 1px solid #dce1ea; border-radius: 8px; padding: 18px; box-shadow: 0 1px 2px rgba(17,24,39,.06); }
    .label { color: #64748b; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
    .value { font-size: 32px; font-weight: 700; margin-top: 8px; }
    code { background: #eef2f7; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <header>
    <h1>AlertPilot Operations Console</h1>
    <p>Incident triage, deduplication, and escalation for production services.</p>
  </header>
  <main>
    <section class="grid">
      <div class="card"><div class="label">API</div><div class="value">FastAPI</div></div>
      <div class="card"><div class="label">Auth</div><div class="value">Bearer</div></div>
      <div class="card"><div class="label">Metrics</div><div class="value">Prometheus</div></div>
      <div class="card"><div class="label">Pipeline</div><div class="value">DVC</div></div>
    </section>
    <section class="card" style="margin-top:16px">
      <h2>Quick Start</h2>
      <p>Authenticate with <code>POST /v1/auth/login</code>, ingest alerts with <code>POST /v1/alerts</code>, and inspect service health at <code>/health</code>.</p>
    </section>
  </main>
</body>
</html>
