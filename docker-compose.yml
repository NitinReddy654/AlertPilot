services:
  app:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      ALERTPILOT_TOKEN_SECRET: local-compose-secret
      ALERTPILOT_BOOTSTRAP_EMAIL: admin@alertpilot.local
      ALERTPILOT_BOOTSTRAP_PASSWORD: changeme
      ALERTPILOT_ENABLE_REDIS: "1"
      ALERTPILOT_REDIS_URL: redis://redis:6379/0
      ALERTPILOT_ENABLE_KAFKA: "1"
      ALERTPILOT_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ALERTPILOT_KAFKA_TOPIC: incident.created
    volumes:
      - alertpilot_data:/app/data
    depends_on:
      redis:
        condition: service_started
      kafka:
        condition: service_started

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: bitnami/kafka:3.7
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./infra/docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/docker/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    depends_on:
      - prometheus

volumes:
  alertpilot_data:
